# Phase 1/2 — ETL als EINE Coolify-Ressource.
#
# PostgreSQL und Metabase existieren bereits als eigene Coolify-Service-Ressource
# (Environment 28). Deren gebuendeltes Postgres 16 traegt die Warehouse-DB
# (Service-Alias `postgresql`, DB `warehouse`, Schemas raw/core/marts). Dieses
# Compose ist NICHT Teil jenes Service, sondern haengt sich per EXTERNEM Netz
# ${WAREHOUSE_NETWORK} (= Docker-Netz des Metabase-Service) ein, damit
# WAREHOUSE_DB_HOST=`postgresql` aus diesen Containern aufloesbar ist.
# Siehe docs/RUNBOOK.md.

services:
  # Deploy-Lauf: Migrationen -> Pipedrive- -> sevDesk-Extraktion. Laeuft bei jedem
  # Deploy durch und beendet sich (exit 0 = Erfolg, sonst schlaegt der Deploy fehl).
  # Alle Schritte idempotent/inkrementell:
  #   migrate           = ueberspringt bereits angewandte Dateien (001-006)
  #   extract (pipedrive) = inkrementell ueber raw._sync_state
  #   extract (sevdesk)   = voller Abzug ab SEVDESK_SINCE, idempotenter Upsert;
  #                         Positionen je Rechnung nachgeladen
  # Der Golden-Check ist BEWUSST kein Deploy-Gate: legitime Datenaenderungen in den
  # Quellen wuerden sonst jeden Deploy und jede Extraktion blockieren. Golden/
  # sevDesk-Test laufen als eigene Services (profile manual).
  etl:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    command:
      - /bin/sh
      - -c
      - >
        npx tsx scripts/migrate.ts &&
        { npx tsx etl/sevdesk/load-kategorien.ts;
          npx tsx etl/pipedrive/load-plz-geo.ts;
          npx tsx etl/load-ziele.ts;
          npx tsx etl/load-auftragsquellen.ts;
          npx tsx etl/load-auftragsquellen-historisch.ts;
          npx tsx etl/load-beauftragungsherkunft.ts;
          npx tsx etl/load-honorar-referenz.ts;
          npx tsx etl/load-marktdaten.ts;
          npx tsx etl/pipedrive/extract-organizations.ts;
          npx tsx etl/pipedrive/extract-deals.ts;
          npx tsx etl/pipedrive/extract-deleted-deals.ts;
          npx tsx etl/pipedrive/extract-deal-flow.ts;
          npx tsx etl/pipedrive/extract-persons.ts;
          npx tsx etl/gutachten/extract-fachwerte.ts;
          npx tsx etl/autoixpert/extract-gutachten.ts;
          npx tsx etl/sevdesk/extract-invoices.ts;
          npx tsx etl/sevdesk/extract-positions.ts;
          npx tsx etl/sevdesk/extract-vouchers.ts;
          npx tsx etl/sevdesk/extract-payments.ts; }
    environment:
      WAREHOUSE_DB_HOST: ${WAREHOUSE_DB_HOST}
      WAREHOUSE_DB_PORT: ${WAREHOUSE_DB_PORT:-5432}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-warehouse}
      ETL_DB_USER: ${ETL_DB_USER:-etl}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD}
      PIPEDRIVE_API_TOKEN: ${PIPEDRIVE_API_TOKEN}
      PIPEDRIVE_COMPANY_DOMAIN: ${PIPEDRIVE_COMPANY_DOMAIN}
      SEVDESK_API_TOKEN: ${SEVDESK_API_TOKEN}
      SEVDESK_API_BASE: ${SEVDESK_API_BASE:-https://my.sevdesk.de/api/v1}
      SEVDESK_SINCE: ${SEVDESK_SINCE:-2024-01-01}
      AUTOIXPERT_API_TOKEN: ${AUTOIXPERT_API_TOKEN}
      AUTOIXPERT_API_BASE: ${AUTOIXPERT_API_BASE:-https://app.autoixpert.de/externalApi/v1}
      GUTACHTEN_MIN_JJ: ${GUTACHTEN_MIN_JJ:-26}
    networks:
      - warehouse
    restart: "no"

  # (Entfernt) Der frühere HTTP-Ingest-Dienst ist obsolet: der Backfill läuft über
  # n8n-Reader (OneDrive + Mistral-OCR) → Auslesen der Execution → Laden per
  # Migration (sql/019 …) in dieser Deploy-Kette. Kein Ingest-Container mehr.

  # Golden-Check (read-only): assertet core.fact_ausbuchung gegen die 20
  # handgeprueften Deals in fixtures/golden-deals.json. Kein Deploy-Gate.
  # Manuell/als Scheduled Task:  docker compose run --rm golden
  golden:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    command: ["npx", "tsx", "scripts/test-golden.ts"]
    environment:
      WAREHOUSE_DB_HOST: ${WAREHOUSE_DB_HOST}
      WAREHOUSE_DB_PORT: ${WAREHOUSE_DB_PORT:-5432}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-warehouse}
      ETL_DB_USER: ${ETL_DB_USER:-etl}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD}
    networks:
      - warehouse
    profiles: ["manual"]
    restart: "no"

  # sevDesk-Test (read-only): DSGVO-Filter + Positionsstruktur + Konsistenz gegen
  # die bekannte Beispiel-Rechnung. Kein Deploy-Gate.
  # Manuell/als Scheduled Task:  docker compose run --rm sevdesk-test
  sevdesk-test:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    command: ["npx", "tsx", "scripts/test-sevdesk.ts"]
    environment:
      WAREHOUSE_DB_HOST: ${WAREHOUSE_DB_HOST}
      WAREHOUSE_DB_PORT: ${WAREHOUSE_DB_PORT:-5432}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-warehouse}
      ETL_DB_USER: ${ETL_DB_USER:-etl}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD}
    networks:
      - warehouse
    profiles: ["manual"]
    restart: "no"

  # Backup-Runner. Nicht als Dauerdienst und NICHT beim Deploy (profile manual).
  # Naechtlich via Coolify Scheduled Task:  docker compose run --rm backup
  # Image-Major = Server-Major (PG_MAJOR=16 fuer die Metabase-Postgres-Instanz).
  backup:
    image: postgres:${PG_MAJOR:-16}-alpine
    entrypoint: ["/bin/sh", "/app/scripts/backup.sh"]
    environment:
      WAREHOUSE_DB_HOST: ${WAREHOUSE_DB_HOST}
      WAREHOUSE_DB_PORT: ${WAREHOUSE_DB_PORT:-5432}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-warehouse}
      ETL_DB_USER: ${ETL_DB_USER:-etl}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts:/app/scripts:ro
      - backups:/backups
    networks:
      - warehouse
    profiles: ["manual"]
    restart: "no"

# Externes Docker-Netz des Metabase-Service (Env 28). Der Name kommt als
# Coolify-Secret WAREHOUSE_NETWORK. Ueber dieses Netz ist `postgresql` erreichbar.
networks:
  warehouse:
    external: true
    name: ${WAREHOUSE_NETWORK}

volumes:
  backups:
